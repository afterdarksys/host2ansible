name: postgres
description: PostgreSQL configuration files, not the data directory
read_only: true
detect:
  any:
    - path: /etc/postgresql
    - path: /var/lib/pgsql
    - systemd: postgresql.service
    - command_ok: ["psql", "--version"]
collect:
  trees:
    - path: /etc/postgresql
      optional: true
      exclude_suffixes: [".bak"]
  globs:
    - root: /var/lib/pgsql
      maxdepth: 4
      names: [postgresql.conf, pg_hba.conf, pg_ident.conf]
      optional: true
  commands:
    - id: version
      argv: ["psql", "--version"]
      optional: true
ansible:
  apply: auto
  packages:
    debian: [postgresql]
    redhat: [postgresql-server]
  service:
    name: postgresql
    state: started
    enabled: true
  validate:
    - argv: ["psql", "--version"]
